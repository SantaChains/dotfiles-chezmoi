# ══════════════════════════════════════════════════════════════════
#  GlazeWM 3.10 配置 —— 键位与 ~/.config/whkdrc（komorebi 模式）完全对齐
#  设计原则：
#   · Alt 单层    = 焦点 / 工作区 / 显示器 / 应用启动器（拇指可达，无小指拉伸）
#   · Alt+Shift 层 = 移动 / 状态 / 尺寸 / 布局（破坏性操作强制走这一层）
#   · 破坏性动作（close/exit）必须 Shift，避免误触
#   · 快捷键只做“经常发生的事”，低频功能留给命令行
#  komorebi 专属能力（布局轮换 / 堆叠 / promote）在此文件无对应命令，属正常差异
# ══════════════════════════════════════════════════════════════════

general:
  # 启动即拉起 Zebar 状态栏（单实例，若已运行则复用）
  startup_commands: ['shell-exec zebar startup']

  # 退出时收掉 Zebar，避免残留一条“幽灵栏”
  shutdown_commands: ['shell-exec taskkill /F /IM zebar.exe']

  config_reload_commands: []

  # 鼠标移动不抢焦点：平铺下这是噪声来源
  focus_follows_cursor: false

  # 再按一次当前工作区 → 回到上一个工作区（快速来回的刚需）
  toggle_workspace_on_refocus: true

  cursor_jump:
    enabled: true
    trigger: 'monitor_focus'

  hide_method: 'cloak'
  show_all_in_taskbar: false

gaps:
  # 8px 内缝：够分出窗口边界，又不浪费像素
  scale_with_dpi: true
  inner_gap: '8px'
  # 顶部 56px = Zebar 栏 40px + 16px 呼吸位；其余方向统一 12px
  outer_gap:
    top: '56px'
    right: '12px'
    bottom: '12px'
    left: '12px'

window_effects:
  focused_window:
    border:
      enabled: true
      color: '#7aa2f7'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'rounded'
    transparency:
      enabled: false
      opacity: '95%'

  other_windows:
    border:
      enabled: true
      color: '#2f3549'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'rounded'
    transparency:
      enabled: false
      opacity: '95%'

window_behavior:
  initial_state: 'tiling'
  state_defaults:
    floating:
      centered: true
      shown_on_top: false
    fullscreen:
      maximized: false
      shown_on_top: false

# 9 个工作区，名字必须是 '1'..'9'：与 komorebi.json 的 1..9 对齐，
# 也让 `focus --workspace 3` 这类命令有稳定的字符串可用
workspaces:
  - name: '1'
    keep_alive: true
  - name: '2'
    keep_alive: true
  - name: '3'
    keep_alive: true
  - name: '4'
    keep_alive: true
  - name: '5'
    keep_alive: true
  - name: '6'
    keep_alive: true
  - name: '7'
    keep_alive: true
  - name: '8'
    keep_alive: true
  - name: '9'
    keep_alive: true

window_rules:
  # ── 不受管的窗口 ──────────────────────────────────────────────
  - commands: ['ignore']
    match:
      # Zebar 栏本身
      - window_process: { equals: 'zebar' }
      # 浏览器画中画
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }
        window_class: { regex: 'Chrome_WidgetWin_1|MozillaDialogClass' }
      # PowerToys 的浮层 / 拾色器 / 预览
      - window_process: { equals: 'PowerToys' }
        window_class: { regex: 'HwndWrapper\[PowerToys\.PowerAccent.*?\]' }
      - window_process: { equals: 'PowerToys' }
        window_title: { regex: '.*? - Peek' }
      # Lively 壁纸宿主
      - window_process: { equals: 'Lively' }
        window_class: { regex: 'HwndWrapper' }
      # Office 的弹出对话框
      - window_process: { equals: 'EXCEL' }
        window_class: { not_regex: 'XLMAIN' }
      - window_process: { equals: 'WINWORD' }
        window_class: { not_regex: 'OpusApp' }
      - window_process: { equals: 'POWERPNT' }
        window_class: { not_regex: 'PPTFrameClass' }

  # ── 默认浮动（本身不是“内容窗口”的那些东西）──────────────────
  - commands: ['set-floating --centered']
    match:
      - window_process: { equals: 'Taskmgr' }
      - window_process: { equals: 'SystemSettings' }
      - window_process: { equals: 'ApplicationFrameHost' }
        window_class: { regex: 'ApplicationFrameWindow' }

# ── 模式化调整：进入 resize 模式后用 hjkl / 方向键连续调整 ──────
binding_modes:
  - name: 'resize'
    display_name: 'RESIZE'
    keybindings:
      - commands: ['resize --width -2%']
        bindings: ['h', 'left']
      - commands: ['resize --width +2%']
        bindings: ['l', 'right']
      - commands: ['resize --height +2%']
        bindings: ['k', 'up']
      - commands: ['resize --height -2%']
        bindings: ['j', 'down']
      - commands: ['wm-disable-binding-mode --name resize']
        bindings: ['escape', 'enter', 'alt+shift+z']

keybindings:
  # ── 焦点：Alt + hjkl / 方向键 ────────────────────────────────
  - commands: ['focus --direction left']
    bindings: ['alt+h', 'alt+left']
  - commands: ['focus --direction down']
    bindings: ['alt+j', 'alt+down']
  - commands: ['focus --direction up']
    bindings: ['alt+k', 'alt+up']
  - commands: ['focus --direction right']
    bindings: ['alt+l', 'alt+right']

  # 跨层循环焦点（平铺 → 浮动 → 全屏）
  - commands: ['wm-cycle-focus']
    bindings: ['alt+oem_open_brackets']

  # 回到上一个工作区（glaze 专属补充，komorebi 侧由 cycle-focus 承担）
  - commands: ['focus --recent-workspace']
    bindings: ['alt+oem_close_brackets']

  # ── 移动窗口：Alt + Shift + hjkl / 方向键 ───────────────────
  - commands: ['move --direction left']
    bindings: ['alt+shift+h', 'alt+shift+left']
  - commands: ['move --direction down']
    bindings: ['alt+shift+j', 'alt+shift+down']
  - commands: ['move --direction up']
    bindings: ['alt+shift+k', 'alt+shift+up']
  - commands: ['move --direction right']
    bindings: ['alt+shift+l', 'alt+shift+right']

  # ── 工作区：Alt + 1..9 切换；Alt + Shift + 1..9 送窗口过去（不切焦点）──
  - commands: ['focus --workspace 1']
    bindings: ['alt+1']
  - commands: ['focus --workspace 2']
    bindings: ['alt+2']
  - commands: ['focus --workspace 3']
    bindings: ['alt+3']
  - commands: ['focus --workspace 4']
    bindings: ['alt+4']
  - commands: ['focus --workspace 5']
    bindings: ['alt+5']
  - commands: ['focus --workspace 6']
    bindings: ['alt+6']
  - commands: ['focus --workspace 7']
    bindings: ['alt+7']
  - commands: ['focus --workspace 8']
    bindings: ['alt+8']
  - commands: ['focus --workspace 9']
    bindings: ['alt+9']

  - commands: ['move --workspace 1']
    bindings: ['alt+shift+1']
  - commands: ['move --workspace 2']
    bindings: ['alt+shift+2']
  - commands: ['move --workspace 3']
    bindings: ['alt+shift+3']
  - commands: ['move --workspace 4']
    bindings: ['alt+shift+4']
  - commands: ['move --workspace 5']
    bindings: ['alt+shift+5']
  - commands: ['move --workspace 6']
    bindings: ['alt+shift+6']
  - commands: ['move --workspace 7']
    bindings: ['alt+shift+7']
  - commands: ['move --workspace 8']
    bindings: ['alt+shift+8']
  - commands: ['move --workspace 9']
    bindings: ['alt+shift+9']

  # ── 显示器（多屏：按索引跳；单屏为空操作）────────────────────
  - commands: ['focus --monitor 0']
    bindings: ['alt+oem_comma']
  - commands: ['focus --monitor 1']
    bindings: ['alt+oem_period']
  - commands: ['move-workspace --direction left']
    bindings: ['alt+shift+oem_comma']
  - commands: ['move-workspace --direction right']
    bindings: ['alt+shift+oem_period']

  # ── 窗口状态 ────────────────────────────────────────────────
  - commands: ['toggle-floating --centered']
    bindings: ['alt+space']
  - commands: ['toggle-fullscreen']
    bindings: ['alt+shift+space']
  - commands: ['toggle-minimized']
    bindings: ['alt+shift+m']
  - commands: ['close']
    bindings: ['alt+shift+q']
  - commands: ['toggle-tiling']
    bindings: ['alt+shift+t']
  - commands: ['set-floating --centered']
    bindings: ['alt+shift+v']

  # ── 尺寸微调（直接按；连续调整用 Alt+Shift+Z 进 resize 模式）──
  - commands: ['resize --width -2%']
    bindings: ['alt+shift+u']
  - commands: ['resize --width +2%']
    bindings: ['alt+shift+i']
  - commands: ['resize --height +2%']
    bindings: ['alt+shift+o']
  - commands: ['resize --height -2%']
    bindings: ['alt+shift+n']
  - commands: ['wm-enable-binding-mode --name resize']
    bindings: ['alt+shift+z']

  # ── 引擎控制 ────────────────────────────────────────────────
  - commands: ['wm-toggle-pause']
    bindings: ['alt+shift+p']
  - commands: ['wm-reload-config']
    bindings: ['alt+shift+r']
  - commands: ['wm-redraw']
    bindings: ['alt+shift+w']
  - commands: ['wm-exit']
    bindings: ['alt+shift+e']

  # ── 应用启动器（与 whkdrc 完全一致）──────────────────────────
  - commands: ['shell-exec wt']
    bindings: ['alt+return']
  - commands: ['shell-exec wt -w 0 nt']
    bindings: ['alt+n']
  - commands: ['shell-exec chrome']
    bindings: ['alt+b']
  - commands: ['shell-exec code']
    bindings: ['alt+e']
  - commands: ['shell-exec explorer']
    bindings: ['alt+f']
  - commands: ['shell-exec explorer D:\Soft']
    bindings: ['alt+d']
  - commands: ['shell-exec pwsh']
    bindings: ['alt+r']
