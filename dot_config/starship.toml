# ╔══════════════════════════════════════════════════════════════╗
# ║  Starship Prompt · 单文件多主题管理                            ║
# ║  启用主题: 樱花粉 Sakura Pink                                 ║
# ║  切换: 注释当前主题全部行, 取消注释目标主题全部行              ║
# ╚══════════════════════════════════════════════════════════════╝

# ════════════════════════════════════════════════════════════════
# 【启用】樱花粉 Sakura Pink · 马卡龙甜色系 (修正版)
# ════════════════════════════════════════════════════════════════

add_newline = false
format = """
[░▒▓](#ffb3d1)\
[ 󰊠 ](bg:#ffb3d1 fg:#1a1a2e)\
[ ](fg:#ffb3d1 bg:#b3c4ff)\
$directory\
[ ](fg:#b3c4ff bg:#ffc8de)\
$git_branch\
$git_status\
[ ](fg:#ffc8de bg:#f2f0f5)\
$nodejs\
$rust\
$golang\
$php\
$python\
[ ](fg:#f2f0f5 bg:#ffb3d1)\
$os\
[ ](fg:#ffb3d1 bg:#b3c4ff)\
$time\
[ ](fg:#b3c4ff bg:#fcfafd)\
$cmd_duration\
[ ](fg:#fcfafd)\
\n$character"""
# ---------- 基础样式配置 ----------
[character]
success_symbol = "[❯](fg:#ffb3d1)"
error_symbol = "[❯](fg:#e53170)"
vimcmd_symbol = "[❮](fg:#b3c4ff)"
# ---------- 目录组件 ----------
[directory]
truncation_length = 3
truncation_symbol = "…/"
format = "[ $path ]($style)"
style = "fg:#1a1a2e bg:#b3c4ff"
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"Projects" = "󱁻 "
"Repos" = "󰘬 "
"Desktop" = " "
# ---------- Git组件 ----------
[git_branch]
symbol = "󰊢"
style = "bg:#ffc8de"
format = '[[ $symbol $branch ](fg:#1a1a2e bg:#ffc8de)]($style)'
[git_status]
style = "bg:#ffc8de"
format = '[[($all_status$ahead_behind )](fg:#1a1a2e bg:#ffc8de)]($style)'
[git_metrics]
disabled = false
style = "bg:#ffc8de"
format = '[[ ±$added-$deleted ](fg:#1a1a2e bg:#ffc8de)]($style)'
# ---------- 编程语言组件 ----------
[nodejs]
symbol = "󰎐"
style = "bg:#f2f0f5"
format = '[[ $symbol ($version) ](fg:#1a1a2e bg:#f2f0f5)]($style)'
[rust]
symbol = "󱘗"
style = "bg:#f2f0f5"
format = '[[ $symbol ($version) ](fg:#1a1a2e bg:#f2f0f5)]($style)'
[golang]
symbol = "󰟓"
style = "bg:#f2f0f5"
format = '[[ $symbol ($version) ](fg:#1a1a2e bg:#f2f0f5)]($style)'
[php]
symbol = "󰌟"
style = "bg:#f2f0f5"
format = '[[ $symbol ($version) ](fg:#1a1a2e bg:#f2f0f5)]($style)'
[python]
symbol = "󰌠"
style = "bg:#f2f0f5"
format = '[[ $symbol ($version) ](fg:#1a1a2e bg:#f2f0f5)]($style)'
# ---------- 系统信息组件 ----------
[os]
disabled = false
style = "bg:#ffb3d1"
format = '[[ $symbol ](fg:#1a1a2e bg:#ffb3d1)]($style)'
[os.symbols]
Windows = "󰖳"
Linux = "󰌽"
Macos = "󰀵"
[time]
disabled = false
time_format = "%R"
style = "bg:#b3c4ff"
format = '[[ 󰅐 $time ](fg:#1a1a2e bg:#b3c4ff)]($style)'
# 替换了execution_time为正确的cmd_duration
[cmd_duration]
disabled = false
min_time = 500
style = "bg:#fcfafd"
format = '[[ 󱑍 $duration ](fg:#1a1a2e bg:#fcfafd)]($style)'
# ---------- 额外增强组件 ----------
[env_var]
disabled = false
variable = "VIRTUAL_ENV"
symbol = "󰀶"
style = "bg:#ffc8de"
format = '[[ $symbol ](fg:#1a1a2e bg:#ffc8de)]($style)'
[battery]
disabled = false
full_symbol = "󰁹"
charging_symbol = "󰂄"
discharging_symbol = "󰂃"
style = "bg:#f2f0f5"
format = '[[ $symbol $percentage ](fg:#1a1a2e bg:#f2f0f5)]($style)'
    

