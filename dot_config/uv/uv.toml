# uv 配置  chezmoi 管理 → ~/.config/uv/uv.toml
# uv 尊重 XDG_CONFIG_HOME。
# 文档: https://docs.astral.sh/uv/reference/settings/

# ── Python 包索引(国内加速镜像;如无需可自行删掉整段)──
[[index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

# ── uv 自带 Python 解释器的下载镜像 ──
python-downloads = "automatic"

# 并发下载数
concurrent-downloads = 8

# 缓存目录留默认(会自动落在 %LOCALAPPDATA%\uv)
