# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json
# lazygit 配置 (chezmoi 管理 / Windows)
# lazygit 版本: 0.65.x
# 只覆盖需要改的默认项,不要把整份默认配置抄进来。
# 改完源文件后执行 `chezmoi apply` 下发;若直接改了目标文件用 `chezmoi re-add` 回存。

########## 界面 ##########
gui:
  # 焦点面板展开(手风琴效果),窄屏更好用
  expandFocusedSidePanel: true
  sidePanelWidth: 0.335
  mouseEvents: true                 # Windows Terminal 下鼠标可用
  wrapLinesInStagingView: true      # 长行(如 markdown)自动换行
  useHunkModeInStagingView: true    # 暂存视图默认按 hunk 选择
  filterMode: fuzzy                 # '/' 过滤用模糊匹配
  timeFormat: "2006-01-02"          # Go 时间格式
  shortTimeFormat: "15:04"
  # 装了 Nerd Font 才开启图标,否则留空字符串
  nerdFontsVersion: "3"
  showRandomTip: false
  commandLogSize: 5
  border: rounded

  theme:
    activeBorderColor:
      - green
      - bold
    inactiveBorderColor:
      - white
    searchingActiveBorderColor:
      - cyan
      - bold
    # reverse 比纯蓝底更适配浅色/深色两种终端
    selectedLineBgColor:
      - reverse
    optionsTextColor:
      - blue
    unstagedChangesColor:
      - red

########## Git ##########
git:
  autoFetch: true
  autoRefresh: true
  commit:
    autoWrapCommitMessage: true
    autoWrapWidth: 72
    signOff: false
  mainBranches:
    - master
    - main
  log:
    order: topo-order
    showGraph: always

  # delta 作为 diff 渲染器(替代旧版的 git.paging)。
  # 注意: delta 的 --navigate 在 lazygit 里无效,不要加。
  # --hyperlinks 让行号可点击,直接跳转到编辑器对应行。
  diffRenderers:
    - name: delta
      type: stdinFilter
      colorArg: always
      command: 'delta --dark --paging=never --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"'
    - name: raw-git
      type: rawGit

########## 外部程序 (Windows) ##########
os:
  # 按 e 用编辑器打开文件。可选: nvim / helix / vscode / vim ...
  editPreset: 'nvim'
  # 打开文件(相当于资源管理器双击)。这是 Windows 默认值,写明以便自定义:
  open: 'start "" {{filename}}'
  # 复制/粘贴到剪贴板在 Windows 上开箱可用,无需配置 copyToClipboardCmd。

########## 键位(仅列出常见微调,删除注释即生效) ##########
keybinding:
  universal:
    # 禁用危险的“放弃全部变更”默认键,防误触
    # discardAllChanges: <disabled>
    # 强制刷新
    # refresh: <f5>
    prevItem: [<up>, k]
    nextItem: [<down>, j]
