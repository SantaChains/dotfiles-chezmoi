[general]
live_config_reload = true

[window]
dimensions = { columns = 120, lines = 35 }
padding = { x = 8, y = 4 }
opacity = 0.98
decorations = "Full"
startup_mode = "Windowed"

[font]
normal = { family = "LigaMonaco Nerd Font", style = "Regular" }
bold = { family = "LigaMonaco Nerd Font", style = "Bold" }
italic = { family = "LigaMonaco Nerd Font", style = "Italic" }
bold_italic = { family = "LigaMonaco Nerd Font", style = "Bold Italic" }
size = 12.5

[colors.primary]
background = "#1a1b26"
foreground = "#a9b1d6"

[colors.cursor]
cursor = "#f7768e"
text = "#1a1b26"

[colors.normal]
black = "#414868"
red = "#f7768e"
green = "#73daca"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#a9b1d6"

[colors.bright]
black = "#565f89"
red = "#f7768e"
green = "#73daca"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#c0caf5"

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 750

[selection]
save_to_clipboard = true

[terminal.shell]
program = "C:\\Program Files\\PowerShell\\7\\pwsh.exe"
args = ["-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass"]

[keyboard]
bindings = [
  { key = "C", mods = "Control|Shift", action = "Copy" },
  { key = "V", mods = "Control|Shift", action = "Paste" },
  { key = "Plus", mods = "Control", action = "IncreaseFontSize" },
  { key = "Minus", mods = "Control", action = "DecreaseFontSize" },
  { key = "0", mods = "Control", action = "ResetFontSize" },
]