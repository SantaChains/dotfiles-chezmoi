#:schema https://yazi-rs.github.io/schemas/keymap.json
#
# 单层覆盖式键位表（Colemak + Vim 心智）
#   - 只用一处 `keymap`，不再叠 prepend_keymap：不存在「高优先级前缀吃掉单键」的死键，
#     `~` 帮助面板里看到的每一条都能按出来。
#   - 方向键语义统一：u/e = 上/下，n/i = 上级/进入，U/E = 上下 5 行，<C-u>/<C-e> = 半页，
#     <C-b>/<C-f> = 整页，gg/G = 首/尾。
#   - 前缀分组（仿 leader）：y=复制相关，p=粘贴/链接，c=change(重命名)/copy，g=goto，
#     t=标签页，m=行模式，,=排序。前缀后按 ~ 看候选。
#   - 平台相关：已移除 Windows 上必失败的绑定（sudo/chmod/mount 插件、dragon-drop、
#     xclip/wl-copy 剪贴板、$SHELL、Linux 家目录路径、未安装的 fzf/zoxide/max-preview 插件）。

[mgr]
keymap = [
	# ── 退出 / 会话 ──────────────────────────────
	{ on = "<Esc>", run = "escape",             desc = "退出视觉模式 / 清空选择 / 取消搜索" },
	{ on = "<C-[>", run = "escape",             desc = "退出视觉模式 / 清空选择 / 取消搜索" },
	{ on = "q",     run = "quit",               desc = "退出 yazi" },
	{ on = "Q",     run = "quit --no-cwd-file", desc = "退出且不回传 cwd 文件" },
	{ on = "<C-c>", run = "close",              desc = "关闭当前标签页（最后一个则退出）" },
	{ on = "<C-z>", run = "suspend",            desc = "挂起进程" },

	# ── 光标移动（Colemak）───────────────────────
	{ on = "u", run = "arrow prev", desc = "上一个文件" },
	{ on = "e", run = "arrow next", desc = "下一个文件" },
	{ on = "<Up>",   run = "arrow prev", desc = "上一个文件" },
	{ on = "<Down>", run = "arrow next", desc = "下一个文件" },
	{ on = "U", run = "arrow -5", desc = "上移 5 行" },
	{ on = "E", run = "arrow 5",  desc = "下移 5 行" },
	{ on = "<C-u>", run = "arrow -50%",  desc = "上移半页" },
	{ on = "<C-e>", run = "arrow 50%",   desc = "下移半页" },
	{ on = "<C-b>", run = "arrow -100%", desc = "上移一页" },
	{ on = "<C-f>", run = "arrow 100%",  desc = "下移一页" },
	{ on = "<S-PageUp>",   run = "arrow -50%",  desc = "上移半页" },
	{ on = "<S-PageDown>", run = "arrow 50%",   desc = "下移半页" },
	{ on = "<PageUp>",     run = "arrow -100%", desc = "上移一页" },
	{ on = "<PageDown>",   run = "arrow 100%",  desc = "下移一页" },
	{ on = [ "g", "g" ], run = "arrow top", desc = "跳到顶部" },
	{ on = "G",          run = "arrow bot", desc = "跳到底部" },
	{ on = "<Home>",     run = "arrow top", desc = "跳到顶部" },
	{ on = "<End>",      run = "arrow bot", desc = "跳到底部" },

	# ── 目录导航 ─────────────────────────────────
	{ on = "n", run = "leave",              desc = "返回上级目录" },
	{ on = "i", run = "plugin smart-enter", desc = "进入子目录 / 打开文件" },
	{ on = "<Left>",  run = "leave",              desc = "返回上级目录" },
	{ on = "<Right>", run = "plugin smart-enter", desc = "进入子目录 / 打开文件" },
	{ on = "H", run = "back",    desc = "回到上一个访问过的目录" },
	{ on = "L", run = "forward", desc = "前进到下一个访问过的目录" },

	# ── 选择 / 视觉模式 ──────────────────────────
	{ on = "<Space>", run = [ "toggle", "arrow 1" ], desc = "切换选中并下移一行" },
	{ on = "<C-a>",   run = "toggle_all --state=on", desc = "全选" },
	{ on = "<C-r>",   run = "toggle_all",            desc = "反选" },
	{ on = "v", run = "visual_mode",         desc = "进入视觉模式（选择）" },
	{ on = "V", run = "visual_mode --unset", desc = "进入视觉模式（取消选择）" },

	# ── 预览 ─────────────────────────────────────
	{ on = "J", run = "seek 5",  desc = "预览下滚 5 行" },
	{ on = "K", run = "seek -5", desc = "预览上滚 5 行" },
	{ on = "<Tab>", run = "spot", desc = "聚焦预览内容" },

	# ── 打开 ─────────────────────────────────────
	{ on = "o",         run = "open",               desc = "打开选中文件" },
	{ on = "O",         run = "open --interactive", desc = "交互式选择打开方式" },
	{ on = "<Enter>",   run = "open",               desc = "打开选中文件" },
	{ on = "<S-Enter>", run = "open --interactive", desc = "交互式选择打开方式" },

	# ── 复制 / 剪切 / 粘贴 ───────────────────────
	{ on = [ "y", "y" ], run = [ "yank", "escape",
		'shell powershell -NoProfile -ExecutionPolicy Bypass -File "C:/Users/Jliu Pureey/AppData/Roaming/yazi/config/scripts/clip-files.ps1" $@'
		], desc = "复制文件，并写入系统剪贴板（可直接粘贴到资源管理器）" },
	{ on = [ "y", "p" ], run = "copy path",             desc = "复制绝对路径" },
	{ on = [ "y", "d" ], run = "copy dirpath",          desc = "复制所在目录路径" },
	{ on = [ "y", "n" ], run = "copy filename",         desc = "复制文件名" },
	{ on = [ "y", "." ], run = "copy name_without_ext", desc = "复制文件名（不含扩展名）" },
	{ on = [ "y", "u" ], run = "copy url",              desc = "复制文件 URL" },
	{ on = "x", run = "yank --cut", desc = "剪切选中文件" },
	{ on = "Y", run = "unyank",     desc = "取消复制 / 剪切状态" },
	{ on = "X", run = "unyank",     desc = "取消复制 / 剪切状态" },
	{ on = [ "p", "p" ], run = "paste",           desc = "粘贴" },
	{ on = [ "p", "o" ], run = "paste --force",   desc = "粘贴（覆盖同名文件）" },
	{ on = [ "p", "l" ], run = "link",            desc = "创建符号链接（绝对路径）" },
	{ on = [ "p", "L" ], run = "link --relative", desc = "创建符号链接（相对路径）" },
	{ on = "<C-->",      run = "hardlink",        desc = "创建硬链接" },

	# ── 删除 / 创建 / 重命名 ─────────────────────
	{ on = "d", run = "remove",               desc = "移到回收站" },
	{ on = "D", run = "remove --permanently", desc = "永久删除" },
	{ on = "a", run = "create",      desc = "新建文件（以 / 结尾则建目录）" },
	{ on = "A", run = "bulk_create", desc = "批量新建（每行一个）" },
	{ on = "r",      run = "rename --cursor=before_ext", desc = "重命名（光标在扩展名前）" },
	{ on = [ "c", "w" ], run = "rename --cursor=before_ext", desc = "重命名（change word 手感）" },

	# ── Shell ───────────────────────────────────
	{ on = ";", run = "shell --interactive",         desc = "执行 shell 命令" },
	{ on = ":", run = "shell --block --interactive", desc = "执行 shell 命令（阻塞）" },

	# ── 显示 / 搜索 / 查找 ───────────────────────
	{ on = ".", run = "hidden toggle", desc = "切换隐藏文件" },
	{ on = "s", run = "search --via=fd",   desc = "按文件名搜索（fd）" },
	{ on = "S", run = "search --via=rg",   desc = "按文件内容搜索（ripgrep）" },
	{ on = "<C-s>", run = "escape --search", desc = "取消进行中的搜索" },
	{ on = "f", run = "filter --smart", desc = "筛选当前目录" },
	{ on = "/", run = "find --smart",            desc = "查找（下一个）" },
	{ on = "?", run = "find --previous --smart", desc = "查找（上一个）" },
	{ on = "=", run = "find_arrow",              desc = "跳到下一个匹配" },
	{ on = "-", run = "find_arrow --previous",   desc = "跳到上一个匹配" },
	{ on = "<C-t>", run = "plugin skim", desc = "模糊跳转（skim，需安装 sk）" },

	# ── 行模式 / 排序 ────────────────────────────
	{ on = [ "m", "s" ], run = "linemode size",        desc = "行模式：大小" },
	{ on = [ "m", "p" ], run = "linemode permissions", desc = "行模式：权限" },
	{ on = [ "m", "b" ], run = "linemode btime",       desc = "行模式：创建时间" },
	{ on = [ "m", "m" ], run = "linemode mtime",       desc = "行模式：修改时间" },
	{ on = [ "m", "o" ], run = "linemode owner",       desc = "行模式：所有者" },
	{ on = [ "m", "n" ], run = "linemode none",        desc = "行模式：无" },
	{ on = [ ",", "m" ], run = [ "sort mtime --reverse=no", "linemode mtime" ],  desc = "按修改时间（正序）" },
	{ on = [ ",", "M" ], run = [ "sort mtime --reverse=yes", "linemode mtime" ], desc = "按修改时间（倒序）" },
	{ on = [ ",", "b" ], run = [ "sort btime --reverse=no", "linemode btime" ],  desc = "按创建时间（正序）" },
	{ on = [ ",", "B" ], run = [ "sort btime --reverse=yes", "linemode btime" ], desc = "按创建时间（倒序）" },
	{ on = [ ",", "e" ], run = "sort extension --reverse=no",                    desc = "按扩展名（正序）" },
	{ on = [ ",", "E" ], run = "sort extension --reverse=yes",                   desc = "按扩展名（倒序）" },
	{ on = [ ",", "a" ], run = "sort alphabetical --reverse=no",                 desc = "按名称（正序）" },
	{ on = [ ",", "A" ], run = "sort alphabetical --reverse=yes",                desc = "按名称（倒序）" },
	{ on = [ ",", "n" ], run = "sort natural --reverse=no",                      desc = "自然排序（正序）" },
	{ on = [ ",", "N" ], run = "sort natural --reverse=yes",                     desc = "自然排序（倒序）" },
	{ on = [ ",", "s" ], run = [ "sort size --reverse=no", "linemode size" ],    desc = "按大小（正序）" },
	{ on = [ ",", "S" ], run = [ "sort size --reverse=yes", "linemode size" ],   desc = "按大小（倒序）" },
	{ on = [ ",", "r" ], run = "sort random --reverse=no",                       desc = "随机排序" },

	# ── 跳转 ────────────────────────────────────
	{ on = [ "g", "h" ],       run = "cd ~",             desc = "家目录" },
	{ on = [ "g", "a" ],       run = "cd ~/Desktop",     desc = "桌面" },
	{ on = [ "g", "d" ],       run = "cd ~/Downloads",   desc = "下载" },
	{ on = [ "g", "w" ],       run = "cd ~/Documents",   desc = "文档" },
	{ on = [ "g", "c" ],       run = "cd ~/.config",     desc = "~/.config" },
	{ on = [ "g", "t" ],       run = "plugin trash",     desc = "回收站" },
	{ on = [ "g", "<Space>" ], run = "cd --interactive", desc = "交互式跳转目录" },
	{ on = [ "g", "f" ],       run = "follow",           desc = "跟随光标下的符号链接" },

	# ── 标签页 ──────────────────────────────────
	{ on = [ "t", "t" ], run = "tab_create --current",     desc = "以当前目录新建标签页" },
	{ on = [ "t", "r" ], run = "tab_rename --interactive", desc = "重命名当前标签页" },
	{ on = "1", run = "tab_switch 0", desc = "第 1 个标签页" },
	{ on = "2", run = "tab_switch 1", desc = "第 2 个标签页" },
	{ on = "3", run = "tab_switch 2", desc = "第 3 个标签页" },
	{ on = "4", run = "tab_switch 3", desc = "第 4 个标签页" },
	{ on = "5", run = "tab_switch 4", desc = "第 5 个标签页" },
	{ on = "6", run = "tab_switch 5", desc = "第 6 个标签页" },
	{ on = "7", run = "tab_switch 6", desc = "第 7 个标签页" },
	{ on = "8", run = "tab_switch 7", desc = "第 8 个标签页" },
	{ on = "9", run = "tab_switch 8", desc = "第 9 个标签页" },
	{ on = "[", run = "tab_switch -1 --relative", desc = "上一个标签页" },
	{ on = "]", run = "tab_switch 1 --relative",  desc = "下一个标签页" },
	{ on = "{", run = "tab_swap -1", desc = "与上一个标签页交换位置" },
	{ on = "}", run = "tab_swap 1",  desc = "与下一个标签页交换位置" },

	# ── 插件（仅保留本机可用的）──────────────────
	{ on = "<C-g>", run = "shell --block lazygit", desc = "lazygit" },
	{ on = "<C-d>", run = "plugin diff",           desc = "对比选中的与光标下的文件" },

	# ── 任务 / 帮助 ─────────────────────────────
	{ on = "w",    run = "tasks:show", desc = "任务管理器" },
	{ on = "~",    run = "help",       desc = "帮助" },
	{ on = "<F1>", run = "help",       desc = "帮助" },
]


[tasks]
keymap = [
	{ on = "<Esc>", run = "close", desc = "关闭任务管理器" },
	{ on = "<C-[>", run = "close", desc = "关闭任务管理器" },
	{ on = "<C-c>", run = "close", desc = "关闭任务管理器" },
	{ on = "w",     run = "close", desc = "关闭任务管理器" },
	{ on = "u", run = "arrow prev", desc = "上一个任务" },
	{ on = "e", run = "arrow next", desc = "下一个任务" },
	{ on = "<Up>",   run = "arrow prev", desc = "上一个任务" },
	{ on = "<Down>", run = "arrow next", desc = "下一个任务" },
	{ on = "<Enter>", run = "inspect", desc = "查看任务详情" },
	{ on = "x",       run = "cancel",  desc = "取消任务" },
	{ on = "~",    run = "help", desc = "帮助" },
	{ on = "<F1>", run = "help", desc = "帮助" },
]


[spot]
keymap = [
	{ on = "<Esc>", run = "close", desc = "关闭聚焦" },
	{ on = "<C-[>", run = "close", desc = "关闭聚焦" },
	{ on = "<C-c>", run = "close", desc = "关闭聚焦" },
	{ on = "<Tab>", run = "close", desc = "关闭聚焦" },
	{ on = "u", run = "arrow prev", desc = "上一行" },
	{ on = "e", run = "arrow next", desc = "下一行" },
	{ on = "n", run = "swipe prev", desc = "上一个文件" },
	{ on = "i", run = "swipe next", desc = "下一个文件" },
	{ on = "<Up>",    run = "arrow prev", desc = "上一行" },
	{ on = "<Down>",  run = "arrow next", desc = "下一行" },
	{ on = "<Left>",  run = "swipe prev", desc = "上一个文件" },
	{ on = "<Right>", run = "swipe next", desc = "下一个文件" },
	{ on = [ "c", "c" ], run = "copy cell", desc = "复制选中单元格" },
	{ on = "~",    run = "help", desc = "帮助" },
	{ on = "<F1>", run = "help", desc = "帮助" },
]


[pick]
keymap = [
	{ on = "<Esc>",   run = "close",          desc = "取消选择" },
	{ on = "<C-[>",   run = "close",          desc = "取消选择" },
	{ on = "<C-c>",   run = "close",          desc = "取消选择" },
	{ on = "<Enter>", run = "close --submit", desc = "确认选择" },
	{ on = "i",       run = "close --submit", desc = "确认选择" },
	{ on = "u", run = "arrow prev", desc = "上一个选项" },
	{ on = "e", run = "arrow next", desc = "下一个选项" },
	{ on = "<Up>",   run = "arrow prev", desc = "上一个选项" },
	{ on = "<Down>", run = "arrow next", desc = "下一个选项" },
	{ on = "~",    run = "help", desc = "帮助" },
	{ on = "<F1>", run = "help", desc = "帮助" },
]


[input]
keymap = [
	{ on = "<C-c>",   run = "close",          desc = "取消输入" },
	{ on = "<Enter>", run = "close --submit", desc = "提交输入" },
	{ on = "<Esc>",   run = "escape",         desc = "回到普通模式 / 取消输入" },
	{ on = "<C-[>",   run = "escape",         desc = "回到普通模式 / 取消输入" },

	# 模式切换（Colemak：k 进插入，n/i 左右移动）
	{ on = "k", run = "insert",                          desc = "进入插入模式" },
	{ on = "K", run = [ "move -999", "insert" ],         desc = "移到行首并插入" },
	{ on = "a", run = "insert --append",                 desc = "在光标后插入" },
	{ on = "A", run = [ "move eol", "insert --append" ], desc = "移到行尾并插入" },
	{ on = "v", run = "visual",                          desc = "进入视觉模式" },
	{ on = "r", run = "replace",                         desc = "替换单个字符" },

	# 选择
	{ on = "V",     run = [ "move bol", "visual", "move eol" ], desc = "选中整行" },
	{ on = "<C-A>", run = [ "move eol", "visual", "move bol" ], desc = "从行尾选到行首" },
	{ on = "<C-E>", run = [ "move bol", "visual", "move eol" ], desc = "从行首选到行尾" },

	# 字符级移动
	{ on = "n",       run = "move -1", desc = "左移一个字符" },
	{ on = "i",       run = "move 1",  desc = "右移一个字符" },
	{ on = "N",       run = "move -999", desc = "移到行首" },
	{ on = "I",       run = "move 999",  desc = "移到行尾" },
	{ on = "<Left>",  run = "move -1", desc = "左移一个字符" },
	{ on = "<Right>", run = "move 1",  desc = "右移一个字符" },
	{ on = "<C-b>",   run = "move -1", desc = "左移一个字符" },
	{ on = "<C-f>",   run = "move 1",  desc = "右移一个字符" },

	# 单词级移动
	{ on = "b",         run = "backward",                   desc = "上一个单词开头" },
	{ on = "B",         run = "backward wide",              desc = "上一个 WORD 开头" },
	{ on = "w",         run = "forward",                    desc = "下一个单词开头" },
	{ on = "W",         run = "forward wide",               desc = "下一个 WORD 开头" },
	{ on = "e",         run = "forward --end-of-word",      desc = "当前/下一个单词结尾" },
	{ on = "E",         run = "forward wide --end-of-word", desc = "当前/下一个 WORD 结尾" },
	{ on = "<A-b>",     run = "backward lean",              desc = "上一个单词开头" },
	{ on = "<A-f>",     run = "forward lean --end-of-word", desc = "当前/下一个单词结尾" },
	{ on = "<C-Left>",  run = "backward lean",              desc = "上一个单词开头" },
	{ on = "<C-Right>", run = "forward lean --end-of-word", desc = "当前/下一个单词结尾" },

	# 行级移动
	{ on = "0",      run = "move bol",        desc = "移到行首" },
	{ on = "$",      run = "move eol",        desc = "移到行尾" },
	{ on = "_",      run = "move first-char", desc = "移到第一个非空白字符" },
	{ on = "^",      run = "move first-char", desc = "移到第一个非空白字符" },
	{ on = "<C-a>",  run = "move bol",        desc = "移到行首" },
	{ on = "<C-e>",  run = "move eol",        desc = "移到行尾" },
	{ on = "<Home>", run = "move bol",        desc = "移到行首" },
	{ on = "<End>",  run = "move eol",        desc = "移到行尾" },

	# 删除
	{ on = "<Backspace>", run = "backspace",         desc = "删除光标前字符" },
	{ on = "<Delete>",    run = "backspace --under", desc = "删除光标处字符" },
	{ on = "<C-h>",       run = "backspace",         desc = "删除光标前字符" },
	{ on = "<C-d>",       run = "backspace --under", desc = "删除光标处字符" },

	# 剪切到（kill）
	{ on = "<C-u>",         run = "kill bol",      desc = "剪切到行首" },
	{ on = "<C-k>",         run = "kill eol",      desc = "剪切到行尾" },
	{ on = "<C-w>",         run = "kill backward", desc = "向前剪切一个单词" },
	{ on = "<A-d>",         run = "kill forward",  desc = "向后剪切一个单词" },
	{ on = "<C-Backspace>", run = "kill backward", desc = "向前剪切一个单词" },
	{ on = "<C-Delete>",    run = "kill forward",  desc = "向后剪切一个单词" },

	# 剪切 / 复制 / 粘贴
	{ on = "d", run = "delete --cut",                                      desc = "剪切选中字符" },
	{ on = "D", run = [ "delete --cut", "move eol" ],                      desc = "剪切到行尾" },
	{ on = "c", run = "delete --cut --insert",                             desc = "剪切选中字符并插入" },
	{ on = "C", run = [ "delete --cut --insert", "move eol" ],             desc = "剪切到行尾并插入" },
	{ on = "s", run = [ "delete --cut --insert", "move 1" ],               desc = "替换当前字符" },
	{ on = "S", run = [ "move bol", "delete --cut --insert", "move eol" ], desc = "清空整行并插入" },
	{ on = "x", run = [ "delete --cut", "move 1 --in-operating" ],         desc = "剪切当前字符" },
	{ on = "y", run = "yank",                                              desc = "复制选中字符" },
	{ on = "p", run = "paste",                                             desc = "粘贴到光标后" },
	{ on = "P", run = "paste --before",                                    desc = "粘贴到光标前" },

	# 撤销 / 重做 / 大小写
	{ on = "l", run = "undo",         desc = "撤销" },
	{ on = "L", run = "redo",         desc = "重做" },
	{ on = "U", run = "casefy upper", desc = "转大写" },

	# 历史
	{ on = "<C-p>",  run = "recall -1", desc = "上一条历史" },
	{ on = "<C-n>",  run = "recall 1",  desc = "下一条历史" },
	{ on = "<Up>",   run = "recall -1", desc = "上一条历史" },
	{ on = "<Down>", run = "recall 1",  desc = "下一条历史" },
	{ on = "j",      run = "recall 1",  desc = "下一条历史" },

	{ on = "~",    run = "help", desc = "帮助" },
	{ on = "<F1>", run = "help", desc = "帮助" },
]


[confirm]
keymap = [
	{ on = "<Esc>",   run = "close",          desc = "取消" },
	{ on = "<C-[>",   run = "close",          desc = "取消" },
	{ on = "<C-c>",   run = "close",          desc = "取消" },
	{ on = "<Enter>", run = "close --submit", desc = "确认" },
	{ on = "y", run = "close --submit", desc = "确认" },
	{ on = "n", run = "close",          desc = "取消" },
	{ on = "<Up>",   run = "arrow prev", desc = "上一项" },
	{ on = "<Down>", run = "arrow next", desc = "下一项" },
	{ on = "~",    run = "help", desc = "帮助" },
	{ on = "<F1>", run = "help", desc = "帮助" },
]


[cmp]
keymap = [
	{ on = "<C-c>",   run = "close",                                      desc = "取消补全" },
	{ on = "<Tab>",   run = "close --submit",                             desc = "确认补全" },
	{ on = "<Enter>", run = [ "close --submit", "input:close --submit" ], desc = "补全并提交" },
	{ on = "<Up>",   run = "arrow prev", desc = "上一个候选" },
	{ on = "<Down>", run = "arrow next", desc = "下一个候选" },
	{ on = "<C-p>",  run = "arrow prev", desc = "上一个候选" },
	{ on = "<C-n>",  run = "arrow next", desc = "下一个候选" },
	{ on = "~",    run = "help", desc = "帮助" },
	{ on = "<F1>", run = "help", desc = "帮助" },
]


[help]
keymap = [
	{ on = "<Esc>",   run = "escape",         desc = "清空筛选 / 关闭帮助" },
	{ on = "<C-[>",   run = "escape",         desc = "清空筛选 / 关闭帮助" },
	{ on = "<C-c>",   run = "close",          desc = "关闭帮助" },
	{ on = "<Enter>", run = "close --submit", desc = "关闭帮助并执行选中项" },
	{ on = "u", run = "arrow prev", desc = "上一行" },
	{ on = "e", run = "arrow next", desc = "下一行" },
	{ on = "<Up>",   run = "arrow prev", desc = "上一行" },
	{ on = "<Down>", run = "arrow next", desc = "下一行" },
	{ on = "<C-p>", run = "arrow prev", desc = "上一行" },
	{ on = "<C-n>", run = "arrow next", desc = "下一行" },
	{ on = "f", run = "filter", desc = "筛选帮助项" },
	{ on = "<F1>", run = "help", desc = "帮助" },
]
