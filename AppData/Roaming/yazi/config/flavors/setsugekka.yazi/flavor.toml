# : 雪月花 Setsugekka — Snow, Moon, Flower
# : Inspired by Kawabata Yasunari's aesthetic
# : 墨色为底，金箔点缀，和纸为文

# : Manager {{{

[manager]
cwd = { fg = "#c9a96e", bold = true }

# Tab
tab_active   = { fg = "#1a1825", bg = "#c9a96e", bold = true }
tab_inactive = { fg = "#d4c8b8", bg = "#3a3848" }

# Find
find_keyword  = { fg = "#c49a9a", bold = true, italic = true, underline = true }
find_position = { fg = "#5c6b8a", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#5c6b8a", bg = "#5c6b8a" }
marker_cut      = { fg = "#a67b7b", bg = "#a67b7b" }
marker_marked   = { fg = "#c9a96e", bg = "#c9a96e" }
marker_selected = { fg = "#c49a9a", bg = "#c49a9a" }

# Count
count_copied   = { fg = "#1a1825", bg = "#5c6b8a" }
count_cut      = { fg = "#1a1825", bg = "#a67b7b" }
count_selected = { fg = "#1a1825", bg = "#c49a9a" }

# Border
border_symbol = "│"
border_style  = { fg = "#3a3848" }

# : }}}


# : Status {{{

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#3a3848", bg = "#1a1825" }

# Mode
mode_normal = { fg = "#1a1825", bg = "#c9a96e", bold = true }
mode_select = { fg = "#1a1825", bg = "#7a8b6e", bold = true }
mode_unset  = { fg = "#1a1825", bg = "#a67b7b", bold = true }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#c9a96e", bg = "#252336" }
progress_error  = { fg = "#a67b7b", bg = "#252336" }

# Permissions
permissions_t = { fg = "#7a8b6e" }
permissions_w = { fg = "#a67b7b" }
permissions_x = { fg = "#c9a96e" }
permissions_r = { fg = "#5c6b8a" }
permissions_s = { fg = "#d4c8b8" }

# : }}}


# : Select {{{

[select]
border   = { fg = "#c9a96e" }
active   = { fg = "#c49a9a", bold = true }
inactive = {}

# : }}}


# : Input {{{

[input]
border   = { fg = "#3a3848" }
value    = { fg = "#d4c8b8" }

# : }}}


# : Completion {{{

[completion]
border = { fg = "#3a3848", bg = "#252336" }

# : }}}


# : Tasks {{{

[tasks]
border  = { fg = "#3a3848" }
title   = {}
hovered = { fg = "#c9a96e", underline = true }

# : }}}


# : Which {{{

[which]
cols            = 3
mask            = { bg = "#1a1825" }
cand            = { fg = "#c9a96e" }
rest            = { fg = "#7a7068" }
desc            = { fg = "#d4c8b8" }
separator       = " ▶ "
separator_style = { fg = "#3a3848" }

# : }}}


# : Help {{{

[help]
on     = { fg = "#c9a96e" }
run    = { fg = "#5c6b8a" }
footer = { fg = "#1a1825", bg = "#d4c8b8" }

# : }}}


# : Notify {{{

[notify]
title_info  = { fg = "#7a8b6e" }
title_warn  = { fg = "#c9a96e" }
title_error = { fg = "#a67b7b" }

# : }}}


# : File-specific styles {{{

[filetype]

rules = [
	# Images — amber glow
	{ mime = "image/*", fg = "#b8956a" },

	# Media — deep indigo
	{ mime = "{audio,video}/*", fg = "#5c6b8a" },

	# Archives — dusty rose
	{ mime = "application/{,g}zip", fg = "#a67b7b" },
	{ mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#a67b7b" },

	# Documents — sage
	{ mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#7a8b6e" },

	# Special files
	{ url = "*", is = "orphan", bg = "#3a3848" },
	{ url = "*", is = "exec",   fg = "#7a8b6e" },

	# Dummy files
	{ url = "*",  is = "dummy", bg = "#3a3848" },
	{ url = "*/", is = "dummy", bg = "#2a2838" },

	# Fallback — gold for folders
	{ url = "*/", fg = "#c9a96e" }
]

# : }}}
